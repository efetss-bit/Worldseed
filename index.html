<style>
/* Layout: an observatory console. The living globe is the hero; the history rail sits beside it, the powers dock below. */
:root {
  --bg: #090f12; --panel: #10191c; --raise: #172327; --line: #22343a; --line2: #2e474e;
  --ink: #ece7da; --muted: #96a7a3; --faint: #62766f;
  --gold: #e9b54d; --gold-soft: rgba(233, 181, 77, .14); --gold-ink: #1d1505;
  --k-life: #72d4a6; --k-death: #e27d6c; --k-war: #f0604c; --k-peace: #82b5ea; --k-tech: #b7a0f2; --k-city: #dac28c; --k-nature: #5fc2c6; --k-nation: #e79ac4; --k-culture: #8fd0e8; --k-wonder: #f3d27e; --k-you: #f4f1ea;
  --f-display: 'Syne', 'Avenir Next', 'Segoe UI', sans-serif;
  --f-body: 'Figtree', -apple-system, 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-text-size-adjust: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 1480px; margin: 0 auto; padding-block: 12px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 260px; }
.mark { font: 800 24px/1 var(--f-display); letter-spacing: -.01em; }
.mark span { color: var(--gold); }
.wname { font: 500 13px/1.2 var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border: 0; padding: 5px 7px; border-radius: 6px; cursor: pointer; min-width: 0; }
.wname:hover { color: var(--ink); background: var(--raise); }
.clock { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 500 12px/1 var(--f-mono); padding: 7px 10px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.era { color: var(--gold); border-color: rgba(233, 181, 77, .45); background: var(--gold-soft); font-family: var(--f-display); font-weight: 700; letter-spacing: .02em; font-size: 13px; }
.chip.live { display: inline-flex; align-items: center; gap: 6px; }
.chip.live i { width: 7px; height: 7px; border-radius: 50%; background: #5ee08f; box-shadow: 0 0 8px #5ee08f; animation: pulse 2s infinite; }
.chip.live.ff i { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
@keyframes pulse { 50% { opacity: .35; } }
.spirit { display: flex; margin-left: auto; align-items: center; gap: 8px; padding: 5px 11px 5px 7px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line2); }
.orb { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3cf, var(--gold) 45%, #8a5a12 100%); box-shadow: 0 0 12px rgba(233, 181, 77, .5); flex: none; }
.spirit b { font: 600 15px/1 var(--f-mono); font-variant-numeric: tabular-nums; }
.spirit small { display: block; font: 10.5px/1.2 var(--f-mono); color: var(--faint); }

/* stage */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 16px; align-items: start; }
@media (max-width: 1020px) { .stage { grid-template-columns: minmax(0, 1fr); } }
.left { display: grid; gap: 12px; min-width: 0; }
.globe { position: relative; width: 100%; height: min(76vh, 780px); min-height: 320px; border-radius: 16px; overflow: hidden; background: #03070b; border: 1px solid var(--line); touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
@media (max-width: 1020px) { .globe { height: auto; aspect-ratio: 1 / 1; max-height: 74vh; } }
.globe.dragging { cursor: grabbing; }
.globe.aiming { cursor: crosshair; }
.globe canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { pointer-events: none; }
.hud { position: absolute; display: flex; gap: 6px; z-index: 2; }
.hud.tl { top: 10px; left: 10px; }
.hud.tr { top: 10px; right: 10px; flex-direction: column; }
.hud.bl { left: 10px; bottom: 10px; right: 10px; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 9px; overflow: hidden; background: rgba(12, 19, 22, .82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.seg button { background: none; border: 0; padding: 7px 10px; font: 500 12px/1 var(--f-mono); color: var(--muted); cursor: pointer; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--ink); box-shadow: inset 0 -2px 0 var(--gold); }
.rbtn { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line2); background: rgba(12, 19, 22, .82); color: var(--ink); font: 600 17px/1 var(--f-mono); cursor: pointer; display: grid; place-items: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.rbtn[aria-pressed="true"] { color: var(--gold); border-color: rgba(233, 181, 77, .6); }
.rbtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.legend { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; display: inline-block; font: 500 11px/1.3 var(--f-mono); color: rgba(236, 231, 218, .78); background: rgba(6, 10, 12, .62); padding: 5px 8px; border-radius: 6px; }
.legend.aim { color: var(--gold); }
.tip { position: absolute; pointer-events: none; background: rgba(9, 15, 17, .93); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; line-height: 1.4; max-width: 250px; z-index: 3; }
.tip .t1 { font-weight: 600; }
.tip .t2 { color: var(--muted); font-family: var(--f-mono); font-size: 11.5px; }
.pin { position: absolute; left: 10px; right: 10px; bottom: 44px; z-index: 3; background: rgba(9, 15, 17, .94); border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 13.5px; max-width: 420px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.pin .p1 { font-weight: 600; }
.pin .p2 { color: var(--muted); font-size: 12.5px; grid-column: 1; }
.pin .x { grid-row: 1 / span 3; grid-column: 2; align-self: start; background: none; border: 0; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
.mapbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { flex: 1 1 260px; min-width: 0; font-size: 13.5px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
.hint em { font-style: normal; font: 600 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); flex: none; }

/* dock */
.dock { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 10px; }
.dock-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dock-title { font: 700 15px/1 var(--f-display); letter-spacing: .01em; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 11px; font-size: 13px; color: var(--muted); cursor: pointer; font-weight: 500; }
.tab[aria-selected="true"] { color: var(--ink); background: var(--raise); border-color: var(--line2); }
.powers { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 8px; }
.pw { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: auto auto; column-gap: 9px; align-items: center; text-align: left; padding: 9px 10px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line); cursor: pointer; min-height: 48px; }
.pw svg { grid-row: span 2; width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.pw .pn { font-size: 13px; font-weight: 600; line-height: 1.2; }
.pw .pc { font: 500 11px/1.3 var(--f-mono); color: var(--faint); }
.pw[aria-pressed="true"] { border-color: var(--gold); background: linear-gradient(180deg, rgba(233, 181, 77, .16), rgba(233, 181, 77, .05)); }
.pw[aria-pressed="true"] svg { color: var(--gold); }
.pw.poor { opacity: .5; }
.pdesc { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); min-height: 32px; }
.pdesc strong { color: var(--ink); font-weight: 600; }
.pdesc .go { color: var(--gold); font-weight: 600; }
.ghost { background: none; border: 1px solid var(--line2); color: var(--muted); border-radius: 8px; padding: 6px 11px; cursor: pointer; font-size: 12.5px; }
.ghost:hover { color: var(--ink); }

/* panel */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-width: 0; max-height: calc(100vh - 96px); min-height: 460px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.ptabs { padding: 10px; border-bottom: 1px solid var(--line); }
.panel .body { overflow-y: auto; padding: 14px 14px 20px; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
.bnav { display: none; }
@media (max-width: 1020px) {
  .app { padding-bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
  .panel { position: static; max-height: none; min-height: 0; border: 0; background: none; }
  .panel .body { padding: 0; overflow: visible; }
  .ptabs { display: none; }
  .app[data-view="globe"] .panel { display: none; }
  .app:not([data-view="globe"]) .left { display: none; }
  .bnav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(9, 15, 18, .96); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .bnav button { flex: 1; background: none; border: 0; color: var(--faint); display: grid; justify-items: center; gap: 3px; font: 600 11px/1 var(--f-body); padding: 6px 0; cursor: pointer; }
  .bnav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .bnav button[aria-current="page"] { color: var(--gold); }
  .globe { aspect-ratio: auto; height: min(calc(100vw - 32px), 47vh); min-height: 260px; max-height: none; }
  .hint span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .seg button { padding: 7px 9px; }
  .left { gap: 10px; }
  .hint { font-size: 12.5px; }
  .dock { padding: 10px; gap: 8px; }
  .dock-title { display: none; }
  .powers { display: flex; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .pw { flex: 0 0 132px; scroll-snap-align: start; }
}
.vhead { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.vhead h2 { margin: 0; font: 800 20px/1.15 var(--f-display); }
.back { background: var(--raise); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; color: var(--muted); }

.ctip { position: absolute; pointer-events: none; background: rgba(9, 15, 17, .95); border: 1px solid var(--line2); border-radius: 8px; padding: 7px 9px; font-size: 12px; line-height: 1.45; z-index: 2; min-width: 130px; }

.tlink { background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-decoration: underline; text-decoration-color: var(--line2); text-underline-offset: 3px; font-size: 13.5px; }
.tb { margin-left: 4px; border-left: 1px solid var(--line2); }

@media (max-width: 520px) { .seg button { padding: 7px 7px; font-size: 11px; } }

.help .pl svg { width: 20px; height: 20px; stroke: var(--muted); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.help .pl span { color: var(--muted); }

      return h;

    let h = '<div class="vhead"><button class="back" id="treeback">&larr; Back</button></div><h2 style="margin:0 0 6px;font:800 20px/1.2 var(--f-display)">Tree of life</h2>';

  function helpHTML() {
    let h = '<div class="help"><h3>The idea</h3><p>Your world lives on its own. Life evolves for about half an hour, then clever apes become the first people. From there, history runs in <b>real time</b>, even when your phone is locked. Camps grow into villages, towns and cities, and tribes become kingdoms, empires and republics.</p><p>Reaching the Space Age takes <b>about six months</b>, but every world is different. Wars, plagues and dark ages slow a people down. Golden ages, geniuses and peaceful trade speed them up. So it can be closer to four or eight months.</p>';
    h += '<h3>Moving around the globe</h3><ul><li><b>Drag</b> to spin the planet.</li><li><b>Pinch</b> (or the + and − buttons) to zoom. Zoom in to read the names of towns.</li><li><b>Tap a place</b> to see who lives there.</li><li>The <b>circular arrow</b> button turns slow automatic spinning on or off.</li><li><b>World, Nations, Faiths, Life</b> at the top of the globe change the colours: real terrain, one colour per nation, one colour per religion, or one colour per species.</li></ul>';
    h += '<h3>Time</h3><ul><li><b>Live</b>: the world moves in real time. This is the normal way to play.</li><li><b>1 h/min</b> and <b>1 day/min</b> fast forward. Whatever happens during fast forward is permanent.</li><li>When you come back after a while, the game replays what you missed and shows a summary.</li></ul>';
    h += '<h3>Your powers</h3><p>Pick a power under the globe, then tap the globe where you want it. Powers cost <b>spirit</b>, which refills by 3 every minute, up to 100. Everything you do is saved in History under <b>Your actions</b>.</p>';
    for (const [k, p] of Object.entries(POWERS)) h += '<div class="pl"><svg viewBox="0 0 20 20">' + ICONS[k] + '</svg><div><b>' + p.n + '</b><br><span>' + esc(p.d) + '</span></div><em>' + p.cost + ' spirit</em></div>';
    h += '<h3>Governments</h3><p>Each nation chooses its own way to govern. Tribes unite under chiefs, and in the Bronze Age they crown kings. Later, revolutions and reforms can bring in other systems, especially after a new age begins, during a dark age or during a long war.</p>' + Object.values(GOVS).map(g => '<div class="pl" style="grid-template-columns:1fr"><div><b>' + g.n + '</b><br><span>' + esc(g.d) + '</span></div></div>').join('') +
      '<h3>Civics</h3><p>Civics are choices the people make about how to live. A nation has 1 civic in the Stone Age and up to 4 later. Peoples sometimes swap one for another.</p>' + Object.values(CIVICS).map(k => '<div class="pl" style="grid-template-columns:1fr"><div><b>' + k.n + '</b><br><span>' + esc(k.d) + '</span></div></div>').join('') +
      '<h3>Power</h3><p>Every nation is rated in military, science, economy, diplomacy, culture and faith. 100 means the best in the world in that field. Government, civics, size, discoveries, wonders, peace and faith all count. A strong military wins more battles, and the overall power decides who is the most powerful nation.</p>' +
      '<h3>Alliances, trade and migrations</h3><p>Peaceful neighbours sign alliances and send soldiers when their ally is attacked. Trade routes link the capitals of neighbours at peace (dashed gold lines on the globe), and alliances show as green lines. Settlers sometimes leave to found towns or whole new peoples far away, and refugees flee floods, famines, eruptions and lost wars.</p>' +
      '<h3>Climate and disasters</h3><p>Every few weeks the climate shifts into an ice age or a warm period, which changes where people can farm. Floods, droughts, earthquakes, wildfires and eruptions also strike on their own.</p>' +
      '<h3>Languages and nature</h3><p>Each band starts with its own language. Languages split into new ones when peoples live apart, and Statistics shows them as family trees. People tame some animals as farm animals and pets, and hunt others until they vanish.</p>' +
      '<h3>Space</h3><p>A moon circles your world. Once a nation reaches spaceflight, you will see rockets launch from its capital and satellites orbiting the globe, and later a lit base on the moon.</p>' +
      '<h3>Following a nation</h3><p>On any nation\u2019s page, tap <b>Follow this nation</b>. Its name gets a gold star on the globe, its news is marked in gold in History (and has its own filter), and it comes first in the summary when you return.</p>' +
      '<h3>Nations, faiths and famous people</h3><p>Every nation has a ruler: elders and chiefs at first, then kings and queens, emperors, and later elected presidents. Rulers earn nicknames from what happens during their reign, like the Builder or the Conqueror. Famous people (prophets, geniuses, generals, explorers and heroes of songs) are listed on each nation\u2019s page.</p><p>Around the time of farming, prophets found faiths. Missionaries spread them to neighbours in peace time, reformers split them, and nations of different faiths can fight holy wars.</p>' +
      '<h3>Your backup</h3><p>Tap the world name at the top, then <b>Save a backup</b>. On iPhone choose <b>Save to Files</b>. If your world is ever lost, use <b>Load a backup</b> on the same screen.</p>' +
      '<h3>Other screens</h3><ul><li><b>History</b>: every age, discovery, war and action with its date and time. Filter to see only what you want.</li><li><b>Statistics</b>: population charts for the whole world and each nation, all faiths, and the <b>tree of life</b>. Tap a nation or a creature for its own page.</li><li>Tap the <b>world name</b> at the top to rename it, hide clouds or start a new world.</li></ul></div>';

  // ---------- ideas ----------
  function pickHint() {
    const o = [], cs = Object.values(S.cultures);
    if (!S.firsts.multi) o.push('Life is still single cells. Try a Spark of life in a warm sea to speed up evolution.', 'Warm seas are the richest. Warm the world a little and see who thrives.');
    else if (!S.firsts.land) o.push('Nothing lives on land yet. Raise land in a crowded shallow sea to give creatures new shores.', 'Rain turns deserts green. Fertile coasts help the first land creatures.');
    else if (S.civStart == null) o.push('Land creatures are getting smarter. Open Nations to find the cleverest, then place a Monolith among them.', 'A meteor wipes out the old rulers and lets new species rise.', 'Switch to the Life view to see every species as its own colour.');
    else {
      o.push('Raise a new island far out at sea and see which people reach it first.', 'Whisper an idea to a small nation to help it catch up with its neighbours.', 'Spin the globe to the night side. Settlements glow there, from campfires to city lights.', 'Zoom in close to read the names of villages and towns.');
      const war = S.wars[0]; if (war && S.cultures[war.a] && S.cultures[war.b]) o.push(Nation(S.cultures[war.a]) + ' and ' + nation(S.cultures[war.b]) + ' are at war. Send a prophet to calm one side, or let history decide.');
      const big = cs.slice().sort((a, b) => b.tiles - a.tiles)[0]; if (big && big.tiles > N * 0.08) o.push(Nation(big) + ' rules a huge share of the world. An earthquake or plague would test it.');
      if (cs.length === 1) o.push('Only one people exists. Sink a strait across their land and watch new nations form on each side.');
      if (cs.some(c => c.pop / capOf(c) > 0.95)) o.push('Some peoples are running out of food. A Bountiful year or rain lets their villages grow.');
    }
    let t = pick(o); if (t === hintText && o.length > 1) t = pick(o);
    hintText = t; $('#hint').textContent = t; hintAt = Date.now();

  // ---------- saving ----------
  function snapshotStr() {
    let str = serialize(Date.now());
    if (dbRef && str.length > 240000) { S.log = S.log.slice(-120); str = serialize(Date.now()); }
    if (dbRef && str.length > 240000 && S.tree) { const T = S.tree; const gone = Object.keys(T).filter(k => T[k][3]).sort((a, b) => T[a][6] - T[b][6]); for (const k of gone.slice(0, Math.max(0, Object.keys(T).length - 150))) { const up = T[k][1]; for (const j in T) if (String(T[j][1]) === k) T[j][1] = up; for (const x of Object.values(S.species)) if (String(x.anc) === k) x.anc = up; delete T[k]; } S.fossils = S.fossils.slice(-10); str = serialize(Date.now()); }
    return str;
  }
  let saveTimer = 0;
  function queueSave(ms) { clearTimeout(saveTimer); saveTimer = setTimeout(save, ms); }
  async function save() {
    if (!S || !ready || busy) return;
    const str = snapshotStr();
    try { localStorage.setItem(KEY, str); } catch (e) { }
    if (!dbRef) return;
    if (saving) { pendingSave = true; return; }
    saving = true;
    try { await dbRef.set({ v: 2, savedAt: S.savedAt, syncAt: S.syncAt, data: str }); } catch (e) { }
    saving = false;
    if (pendingSave) { pendingSave = false; save(); }
  }
  setInterval(save, 60000);
  let hiddenAt = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); save(); }
    else if (ready && !busy) { const gap = Date.now() - S.syncAt; if (gap > 5 * 60000) catchUp(true); }
  });
  window.addEventListener('pagehide', save);
  async function connectStore() {
    try {
      if (!window.claude || !window.claude.use) return null;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return null;
      const id = await user.id(); if (!id) return null;
      dbRef = db.doc('data/users/' + id + '/world');
      const snap = await dbRef.get();
      if (snap.exists) { const d = snap.data(); if (d && d.v === 2 && typeof d.data === 'string') return { savedAt: d.savedAt || 0, data: d.data }; }
      return { savedAt: 0, data: null };
    } catch (e) { return null; }
  }

  // ---------- time ----------
  // The world is simulated up to S.syncAt. Live play advances it with the clock; when you come back, the gap is replayed.
  function liveSteps(now) {
    let n = 0;
    while (now - S.syncAt >= tickMs() && n < 40) { const dt = tickMs(); STAMP = S.syncAt + dt; step(); S.syncAt += dt; n++; }
    STAMP = 0; return n;
  }
  async function catchUp(show) {
    const start = S.syncAt, total = Date.now() - start; if (total < tickMs()) return;
    busy = true;
    const mark = S.log.length ? S.log[S.log.length - 1] : null, eraBefore = eraName(), bornBefore = S.stats.born, citiesBefore = S.cities.length;
    if (show) openModal('<div class="kicker">Welcome back</div><h2>Your world kept living</h2><p>You were away for ' + fmtDur(total) + '. Replaying everything that happened…</p><div class="prog"><i id="pg"></i></div><p class="small" id="pgt"></p>');
    const t0 = performance.now(), BUDGET = 12000; let steps = 0;
    while (Date.now() - S.syncAt >= tickMs()) {
      const c0 = performance.now();
      for (let k = 0; k < 800 && Date.now() - S.syncAt >= tickMs() * S.fast; k++) { const dt = tickMs() * S.fast; STAMP = S.syncAt + dt; step(); S.syncAt += dt; steps++; }
      if (Date.now() - S.syncAt < tickMs() * S.fast) { S.fast = 1; break; }
      // keep the replay within the time budget: if we are behind, let each step stand for a little more time
      const spent = performance.now() - t0, perStep = (performance.now() - c0) / 800, left = Date.now() - S.syncAt;
      const afford = Math.max(200, (BUDGET - spent) / Math.max(perStep, 0.005));
      const need = left / tickMs();
      S.fast = need > afford ? Math.min(400, need / afford) : 1;
      const pg = document.getElementById('pg'); if (pg) pg.style.width = ((S.syncAt - start) / total * 100).toFixed(1) + '%';
      const pt = document.getElementById('pgt'); if (pt) pt.textContent = 'Replaying ' + new Date(S.syncAt).toLocaleString('en-GB', { weekday: 'short', hour: '2-digit', minute: '2-digit' }) + ' · ' + dateLabel();
      await sleep(0);
    }
    STAMP = 0; S.fast = 1; S.syncAt = Math.min(S.syncAt, Date.now()); busy = false; texDirty = true;
    renderAll();
    if (!show) { save(); return; }
    const idx = mark ? S.log.lastIndexOf(mark) : -1;
    const fresh = idx >= 0 ? S.log.slice(idx + 1) : S.log.slice();
    const rank = { big: 0, you: 1, tech: 2, nation: 3, wonder: 4, war: 5, culture: 6, city: 7, death: 8, life: 9, peace: 10, nature: 11 };
    const favC = S.fav && S.cultures[S.fav], favNews = favC ? fresh.filter(l => l.x.includes(favC.name)).slice(-4) : [];
    const top = fresh.filter(l => !favNews.includes(l)).sort((a, b) => (rank[a.k] - rank[b.k]) || (b.at - a.at)).slice(0, favNews.length ? 6 : 9).sort((a, b) => a.at - b.at);
    const eraAfter = eraName();
    openModal('<div class="kicker">While you were away · ' + fmtDur(total) + '</div><h2>' + (eraAfter !== eraBefore ? 'Your world entered the ' + esc(eraAfter) : esc(S.name) + ' lived on') + '</h2>' +
      '<p>' + fresh.length + ' events were written into history' + (S.cities.length > citiesBefore ? ', ' + (S.cities.length - citiesBefore) + ' new settlements were founded' : '') + (S.stats.born > bornBefore ? ', and ' + (S.stats.born - bornBefore).toLocaleString('en-US') + ' new species appeared' : '') + '. It is now ' + esc(dateLabel()) + '.</p>' +
      (favNews.length ? '<div class="kicker" style="margin-top:4px">\u2605 News from ' + esc(nation(favC)) + '</div><ul class="away">' + favNews.map(l => '<li><span class="dot" style="background:#f3c766"></span><span>' + esc(l.x) + '<small>' + dayLabel(l.at) + ', ' + tm(l.at) + ' · ' + esc(l.d) + '</small></span></li>').join('') + '</ul><div class="kicker" style="margin-top:4px">Around the world</div>' : '') +
      (top.length ? '<ul class="away">' + top.map(l => '<li><span class="dot" style="background:' + (KIND[l.k] || '#888') + '"></span><span>' + esc(l.x) + '<small>' + dayLabel(l.at) + ', ' + tm(l.at) + ' · ' + esc(l.d) + '</small></span></li>').join('') + '</ul>' : '<p>A quiet time. Nothing remarkable made it into the history.</p>') +
      '<div class="rowbtns"><button class="btn" id="mclose">Return to your world</button><button class="ghost" id="mhist">Open full history</button></div>');
    save();
  }

    const id = e.target.id;
    if ((id === 'mclose' || e.target === $('#modal')) && !busy) closeModal();

    if (id === 'mhelp') { closeModal(); setView('help'); }

    if (id === 'clouds') { clouds = !clouds; e.target.textContent = clouds ? 'Hide clouds' : 'Show clouds'; }
    if (id === 'bksave') exportBackup();
    if (id === 'bkload') $('#bkfile').click();
    if (id === 'bkyes' && pendingBackup) { const str = pendingBackup; pendingBackup = null; try { deserialize(str); S.fast = 1; ready = true; texDirty = true; inspectTile = -1; $('#pin').hidden = true; statSel = 0; spSel = 0; treeOpen = false; renderAll(); closeModal(); toast('Backup loaded.'); save(); if (Date.now() - S.syncAt > 5 * 60000) catchUp(true); } catch (err) { toast('That backup could not be loaded.'); } }
    if (id === 'reset1') { e.target.hidden = true; $('#reset2').hidden = false; $('#resetnote').hidden = false; }
    if (id === 'reset2') { closeModal(); const nm = ($('#wn').value || '').trim().slice(0, 40) || randomName(); startNew(nm); }
  });
  $('#wname').addEventListener('click', () => {
    openModal('<div class="kicker">Your world</div><h2>' + esc(S.name) + '</h2><p>Created ' + fullDate(S.created) + '. It is now ' + esc(dateLabel()) + ', in the ' + esc(eraName()) + '. You have used your powers ' + (S.stats.actions || 0) + ' times.</p>' +
      '<div class="field"><label for="wn">World name</label><input id="wn" maxlength="40" value="' + esc(S.name) + '"></div>' +
      '<div class="rowbtns"><button class="btn" id="rename">Save name</button><button class="ghost" id="clouds">' + (clouds ? 'Hide clouds' : 'Show clouds') + '</button><button class="ghost" id="mclose">Close</button></div>' +
      '<div style="border-top:1px solid var(--line);padding-top:14px;display:grid;gap:8px"><b style="font-size:14px">Backup</b><p class="small" style="margin:0">Save your whole world as a file, and load it back if anything ever goes wrong.' + (S.lastBackup ? ' Last backup: ' + fullDate(S.lastBackup) + '.' : ' You have not made a backup yet.') + '</p><div class="rowbtns"><button class="btn" id="bksave">Save a backup</button><button class="ghost" id="bkload">Load a backup</button></div></div>' +
      '<div class="rowbtns" style="border-top:1px solid var(--line);padding-top:14px"><button class="ghost" id="reset1">Start a new world…</button><button class="btn danger" id="reset2" hidden>Erase this world and start over</button></div><p class="small" id="resetnote" hidden>This cannot be undone. The new world takes the name in the box above.</p>');
  });
  let pendingBackup = null;
  async function exportBackup() {
    const now = Date.now(); S.lastBackup = now;
    const str = serialize(now), d = new Date(now), stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const filename = 'worldseed-' + S.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '-' + stamp + '.json';
    try {
      const file = new File([str], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Worldseed backup' }); toast('Backup ready. Choose "Save to Files" to keep it.'); save(); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (dl) { await dl.save({ filename, data: str }); toast('Backup saved.'); save(); return; } } catch (e) { }
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([str], { type: 'application/json' })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); toast('Backup saved to your downloads.'); save(); } catch (e) { toast('This device could not save the file.'); }
  }
  $('#bkfile').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const str = await f.text(), o = JSON.parse(str);
      if (o.v !== 2 || !o.maps) throw new Error('bad');
      pendingBackup = str;
      openModal('<div class="kicker">Load a backup</div><h2>' + esc(o.name) + '</h2><p>Saved ' + fullDate(o.savedAt) + '. Loading it replaces the world you have now. Time since the backup will be replayed, as if you had been away.</p><div class="rowbtns"><button class="btn danger" id="bkyes">Replace my world with this backup</button><button class="ghost" id="mclose">Cancel</button></div>');
    } catch (err) { toast('That file is not a Worldseed backup.'); }
  });
  function randomName() { return pick(['Aster', 'Veloria', 'Thalassa', 'Orun', 'Mireth', 'Caldera', 'Ysolde', 'Pelagon', 'Ember', 'Nerith', 'Anatolia', 'Tisza']) + ' ' + pick(['Prime', 'II', 'Minor', 'Reach', 'Garden', 'Major']); }
  function startNew(nm, note) {
    newWorld((Math.random() * 1e9) | 0, nm, Date.now()); S.syncAt = Date.now();
    inspectTile = -1; $('#pin').hidden = true; lastBody = ''; texDirty = true; ready = true; renderAll(); save();
    openModal('<div class="kicker">A world is born</div><h2>Welcome to ' + esc(S.name) + '</h2>' + (note ? '<p style="color:var(--gold)">' + note + '</p>' : '') +
      '<p>Life has just begun as a few cells in a warm sea. In about half an hour of real time they will evolve into clever apes, and a band of them will light the first fire.</p>' +
      '<p>From then on your world runs in real time, even while your phone is locked. Camps become villages, villages become towns and cities, tribes become kingdoms and republics with borders you can see from space. Reaching the Space Age takes about six months.</p>' +
      '<p>Everything that happens, and everything you do, is written into the History with its date and time.</p>' +
      '<div class="rowbtns"><button class="btn" id="mclose">Watch life begin</button><button class="ghost" id="mhelp">How to play</button></div>');
  }

  // ---------- loop ----------
  function renderAll() { renderHeader(); renderDock(); renderPanel(true); pickHint(); }
  let last = performance.now(), acc = 0, uiAt = 0;
  function frame(t) {
    const dt = Math.min(t - last, 250); last = t;
    if (ready && !busy && S) {
      const now = Date.now();
      if (speed === 1) { if (now - S.syncAt > 5 * 60000) catchUp(true); else if (liveSteps(now)) texDirty = true; }
      else {
        acc += dt * speed; let n = 0;
        while (acc >= tickMs() && n < 300) { acc -= tickMs(); step(); n++; }
        if (acc > tickMs() * 300) acc = 0;
        S.syncAt = now; if (n) texDirty = true;
      }
    }
    if (anim) { const k = clamp((t - anim.t0) / anim.d, 0, 1), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; yaw = anim.y0 + (anim.y1 - anim.y0) * e; pitch = anim.p0 + (anim.p1 - anim.p0) * e; zoom = anim.z0 + (anim.z1 - anim.z0) * e; if (k >= 1) anim = null; }
    else if (!ptrs.size) {
      if (Math.abs(vyaw) + Math.abs(vpitch) > 0.0001) { yaw += vyaw; pitch = clamp(pitch + vpitch, -1.35, 1.35); vyaw *= 0.93; vpitch *= 0.93; }
      else if (spin && !spinHold && t - lastTouch > 7000) yaw += dt * 0.00004 * (zoom > 2 ? 0.4 : 1);
    }
    if (S && texDirty && (t - lastPaint > (speed > 1 ? 450 : S.civStart == null ? 1500 : 150))) paintTex();
    if (S && hl && performance.now() > hl.until) { hl = null; texDirty = true; }
    render(t);
    if (ready && t - uiAt > 800) {
      uiAt = t; renderHeader();
      const lk = S.log.length ? S.log[S.log.length - 1].at + ':' + S.log.length : '';
      if (ptab === 'hist') { if (lk !== lastLogKey) { lastLogKey = lk; renderPanel(false); } }
      else if (ptab === 'stats' && !chartHover && t - panelAt > 4000) { panelAt = t; renderPanel(false); }
      const e = Math.floor(energyNow(Date.now())); if (e !== renderDock._e) { renderDock._e = e; renderDock(); }
      const er = eraName(); if (Date.now() - hintAt > 45000 || er !== pickHint._era) { pickHint._era = er; pickHint(); }
    }
    requestAnimationFrame(frame);
  }

  // ---------- boot ----------
  async function boot(hot) {
    resize();
    let okGL = false; try { okGL = initGL(); } catch (e) { okGL = false; }
    requestAnimationFrame(frame);
    if (hot && hot.save) { try { deserialize(hot.save); ready = true; texDirty = true; renderAll(); return; } catch (e) { } }
    let local = null, hadOld = false;
    try { const str = localStorage.getItem(KEY); if (str) local = { data: str, savedAt: JSON.parse(str).savedAt || 0 }; if (localStorage.getItem('worldseed.save.v1')) hadOld = true; } catch (e) { local = null; }
    openModal('<div class="kicker">Worldseed</div><h2>Finding your world…</h2><div class="prog"><i style="width:35%"></i></div>');
    busy = true;
    const storeP = connectStore();
    const remote = await Promise.race([storeP, sleep(4000).then(() => undefined)]);
    let chosen = local;
    if (remote && remote.data && (!local || remote.savedAt > local.savedAt)) chosen = remote;
    busy = false;
    if (chosen) { try { deserialize(chosen.data); if (!S.syncAt) S.syncAt = S.savedAt; } catch (e) { chosen = null; } }
    if (!chosen) startNew(randomName(), hadOld ? 'Your first world was rebuilt as a globe, so this is a fresh start.' : '');
    else { closeModal(); ready = true; texDirty = true; renderAll(); if (Date.now() - S.syncAt > 5 * 60000) await catchUp(true); }
    if (remote === undefined) storeP.then(r => { if (r && r.data && r.savedAt > (S.savedAt || 0) + 10000 && !busy) { try { deserialize(r.data); texDirty = true; renderAll(); catchUp(true); } catch (e) { } } else if (dbRef) save(); });
    else if (dbRef && (!remote || !remote.data || chosen !== remote)) save();
    if (!okGL) toast('Your browser could not start the 3D globe.');
  }
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) { try { window.claude.hot.snapshot(() => ({ save: S && ready ? serialize(Date.now()) : null })); } catch (e) { } }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
